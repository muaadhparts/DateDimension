name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  npm_config_cache: ${{ github.workspace }}/.sites-runtime/npm-cache

jobs:
  quality:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: .sites-runtime/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - name: Verify formatting
        run: |
          if ! npm run format:check; then
            npm run format
            git diff
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run lint
      # Runtime dependencies must be clean. The dev tree still carries
      # advisories in the build toolchain (vinext, vite, wrangler and the
      # Next.js packages they pull in); upgrading that is its own piece of
      # work, and none of it ships.
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build and integration tests
    needs: quality
    runs-on: ubuntu-latest
    env:
      SITES_BUILD_TIMEOUT: 8m
      SITE_URL: https://yourdaynow.online
      PUBLIC_INDEXING: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: .sites-runtime/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:integration
